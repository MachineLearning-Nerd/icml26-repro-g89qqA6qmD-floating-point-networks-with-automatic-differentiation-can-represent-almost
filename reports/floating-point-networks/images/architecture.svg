<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Thirteen-layer finite-domain construction</title>
  <desc id="desc">An input is sent through exact indicators to parallel value and gradient branches, then joined by a left-to-right affine sum.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="420" rx="24" fill="#f8fafc"/>
  <text x="52" y="58" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#0f172a">The tested code path: a real multilayer network, not a scalar proxy</text>
  <g font-family="system-ui,sans-serif">
    <rect x="52" y="165" width="120" height="80" rx="14" fill="#0f172a"/>
    <text x="112" y="198" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">input x</text>
    <text x="112" y="224" text-anchor="middle" fill="#cbd5e1" font-size="14">float32</text>
    <line x1="172" y1="205" x2="246" y2="205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="255" y="125" width="190" height="160" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="350" y="165" text-anchor="middle" fill="#1e3a8a" font-size="19" font-weight="700">ExactIndicator bank</text>
    <text x="350" y="197" text-anchor="middle" fill="#334155" font-size="15">6 active points</text>
    <text x="350" y="224" text-anchor="middle" fill="#334155" font-size="15">6×6 identity matrix</text>
    <text x="350" y="251" text-anchor="middle" fill="#334155" font-size="15">off-points → 0</text>
    <line x1="445" y1="172" x2="540" y2="120" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="445" y1="238" x2="540" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="550" y="78" width="230" height="110" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="665" y="116" text-anchor="middle" fill="#14532d" font-size="19" font-weight="700">Value branches</text>
    <text x="665" y="145" text-anchor="middle" fill="#334155" font-size="15">ZeroGradIndicator</text>
    <text x="665" y="168" text-anchor="middle" fill="#334155" font-size="15">target value, AD gradient 0</text>
    <rect x="550" y="232" width="230" height="110" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="665" y="270" text-anchor="middle" fill="#78350f" font-size="19" font-weight="700">Gradient branches</text>
    <text x="665" y="299" text-anchor="middle" fill="#334155" font-size="15">calibrated GradIndicator</text>
    <text x="665" y="322" text-anchor="middle" fill="#334155" font-size="15">output 0, target AD gradient</text>
    <line x1="780" y1="133" x2="870" y2="185" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="780" y1="287" x2="870" y2="233" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="880" y="157" width="188" height="100" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="974" y="193" text-anchor="middle" fill="#4c1d95" font-size="19" font-weight="700">Affine join</text>
    <text x="974" y="221" text-anchor="middle" fill="#334155" font-size="15">paper-order sum</text>
    <text x="974" y="244" text-anchor="middle" fill="#334155" font-size="15">network depth = 13</text>
  </g>
  <text x="52" y="385" font-family="system-ui,sans-serif" font-size="15" fill="#475569">Exact on the declared six-point domain; this finite construction is not a universal proof.</text>
</svg>
