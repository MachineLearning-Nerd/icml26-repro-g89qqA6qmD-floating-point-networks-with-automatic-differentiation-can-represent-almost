<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Claim-by-claim reproduction evidence</title>
  <desc id="desc">Claims one through five have strong finite evidence but remain blocked at universal theorem scope. Claim six is verified.</desc>
  <rect width="1120" height="430" rx="24" fill="#0b1020"/>
  <text x="55" y="62" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="30" font-weight="700">What the reproduction actually establishes</text>
  <text x="55" y="94" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="17">Exact finite checks are separated from universal theorem verdicts.</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(55 130)">
      <rect width="160" height="210" rx="16" fill="#172033" stroke="#f59e0b" stroke-width="2"/>
      <text x="18" y="35" fill="#fbbf24" font-size="19" font-weight="700">Claim 1</text>
      <text x="18" y="70" fill="#f8fafc" font-size="28" font-weight="700">13 layers</text>
      <text x="18" y="102" fill="#cbd5e1" font-size="15">6/6 values</text>
      <text x="18" y="126" fill="#cbd5e1" font-size="15">6/6 gradients</text>
      <text x="18" y="150" fill="#cbd5e1" font-size="15">6/6 off-controls</text>
      <text x="18" y="190" fill="#fbbf24" font-size="15" font-weight="700">BLOCKED ∀ scope</text>
    </g>
    <g transform="translate(230 130)">
      <rect width="160" height="210" rx="16" fill="#172033" stroke="#f59e0b" stroke-width="2"/>
      <text x="18" y="35" fill="#fbbf24" font-size="19" font-weight="700">Claim 2</text>
      <text x="18" y="70" fill="#f8fafc" font-size="28" font-weight="700">6 / 6</text>
      <text x="18" y="102" fill="#cbd5e1" font-size="15">activations</text>
      <text x="18" y="126" fill="#cbd5e1" font-size="15">Conditions 2 + 3</text>
      <text x="18" y="150" fill="#cbd5e1" font-size="15">autograd agrees</text>
      <text x="18" y="190" fill="#fbbf24" font-size="15" font-weight="700">BLOCKED ∀ scope</text>
    </g>
    <g transform="translate(405 130)">
      <rect width="160" height="210" rx="16" fill="#172033" stroke="#f59e0b" stroke-width="2"/>
      <text x="18" y="35" fill="#fbbf24" font-size="19" font-weight="700">Claim 3</text>
      <text x="18" y="70" fill="#f8fafc" font-size="28" font-weight="700">569 layers</text>
      <text x="18" y="102" fill="#cbd5e1" font-size="15">60/60 values</text>
      <text x="18" y="126" fill="#cbd5e1" font-size="15">60/60 gradients</text>
      <text x="18" y="150" fill="#cbd5e1" font-size="15">4 routes audited</text>
      <text x="18" y="190" fill="#fbbf24" font-size="15" font-weight="700">BLOCKED ∀ scope</text>
    </g>
    <g transform="translate(580 130)">
      <rect width="160" height="210" rx="16" fill="#172033" stroke="#f59e0b" stroke-width="2"/>
      <text x="18" y="35" fill="#fbbf24" font-size="19" font-weight="700">Claim 4</text>
      <text x="18" y="70" fill="#f8fafc" font-size="28" font-weight="700">48 / 48</text>
      <text x="18" y="102" fill="#cbd5e1" font-size="15">target values</text>
      <text x="18" y="126" fill="#cbd5e1" font-size="15">zero gradients</text>
      <text x="18" y="150" fill="#cbd5e1" font-size="15">full architecture</text>
      <text x="18" y="190" fill="#fbbf24" font-size="15" font-weight="700">BLOCKED ∀ scope</text>
    </g>
    <g transform="translate(755 130)">
      <rect width="160" height="210" rx="16" fill="#172033" stroke="#f59e0b" stroke-width="2"/>
      <text x="18" y="35" fill="#fbbf24" font-size="19" font-weight="700">Claim 5</text>
      <text x="18" y="70" fill="#f8fafc" font-size="28" font-weight="700">0.5 fix</text>
      <text x="18" y="102" fill="#cbd5e1" font-size="15">24/24 calibrated</text>
      <text x="18" y="126" fill="#cbd5e1" font-size="15">6/6 composed</text>
      <text x="18" y="150" fill="#cbd5e1" font-size="15">released: 0/48</text>
      <text x="18" y="190" fill="#fbbf24" font-size="15" font-weight="700">BLOCKED ∀ scope</text>
    </g>
    <g transform="translate(930 130)">
      <rect width="135" height="210" rx="16" fill="#12342d" stroke="#34d399" stroke-width="2"/>
      <text x="16" y="35" fill="#6ee7b7" font-size="19" font-weight="700">Claim 6</text>
      <text x="16" y="70" fill="#f8fafc" font-size="26" font-weight="700">bit gap</text>
      <text x="16" y="102" fill="#d1fae5" font-size="14">exact rational</text>
      <text x="16" y="126" fill="#d1fae5" font-size="14">checker</text>
      <text x="16" y="150" fill="#d1fae5" font-size="14">control passes</text>
      <text x="16" y="190" fill="#6ee7b7" font-size="15" font-weight="700">VERIFIED</text>
    </g>
  </g>
  <text x="55" y="390" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="15">BLOCKED means the finite evidence passed, but the paper’s universal quantifier lacks a proof certificate.</text>
</svg>
